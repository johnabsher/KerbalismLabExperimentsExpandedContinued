//==============================================================
// ADVASC
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_ADVASC
    title = #KLEEC_ADVASC_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 40
    scienceCap = 40

    // dataScale = size / value = 17500 / 40
    dataScale = 437.5

    KERBALISM_EXPERIMENT
    {
        Situation = BodyGlobal
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        ADVASC
        {
            ECCost = 1.0
            size = 17500
            value = 40
            duration = 4320000
            SetupMass = 1.00
            SetupCost = 7500
            UnlockTech = hydroponics
            requirements = Greenhouse
            CrewRequirement = Scientist:2
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_ADVASC

        ec_rate = 1.0
        crew_operate = Scientist:2
        requires = Greenhouse

        // data_rate = size / duration / LabDataRateMultiplier
        // 17500 / 4320000 / 2
        data_rate = 0.002025
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = ADVASC
            title = #KLEEC_ADVASC_title
            desc = #KLEEC_ADVASC_desc

            tech = hydroponics
            mass = 1.00
            cost = 7500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_ADVASC
            }
        }
    }
}