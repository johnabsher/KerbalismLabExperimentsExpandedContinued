//==============================================================
// CXBN-2
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_CXBN-2
    title = #KLEEC_CXBN_2_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 300
    scienceCap = 300

    // dataScale = size / value = 12500 / 300
    dataScale = 41.666667

    KERBALISM_EXPERIMENT
    {
        Situation = Space
        BodyAllowed = HomeBody
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        CXBN-2
        {
            ECCost = 1.8
            size = 12500
            value = 300
            duration = 15729120
            SetupMass = 4
            SetupCost = 18500
            UnlockTech = experimentalElectrics
            requirements = Module:RadioLabExperimentPackage
            CrewRequirement = Scientist:4
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_CXBN-2

        ec_rate = 1.8
        crew_operate = Scientist:4
        requires = Module:RadioLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 12500 / 15729120 / 2
        data_rate = 0.000397
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = CXBN-2
            title = #KLEEC_CXBN_2_title
            desc = #KLEEC_CXBN_2_desc

            tech = experimentalElectrics
            mass = 4
            cost = 18500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_CXBN-2
            }
        }
    }
}