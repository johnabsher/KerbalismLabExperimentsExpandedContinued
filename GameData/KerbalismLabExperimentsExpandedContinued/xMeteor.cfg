//==============================================================
// xMeteor
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_xMeteor
    title = #KLEEC_XMETEOR_title

    baseValue = 250
    scienceCap = 250

    // dataScale = size / value = 8000 / 250
    dataScale = 32

    KERBALISM_EXPERIMENT
    {
        Situation = Space
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        xMeteor
        {
            ECCost = 1.2
            size = 8000
            value = 250
            duration = 324000
            SetupMass = 2.5
            SetupCost = 5000
            UnlockTech = advExploration
            requirements = Module:SpectrometerLabExperimentPackage,MaxAsteroidDistance:5000
            CrewRequirement = Scientist:2
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_xMeteor

        ec_rate = 1.2
        crew_operate = Scientist:2
        requires = Module:SpectrometerLabExperimentPackage,MaxAsteroidDistance:5000

        // data_rate = size / duration / LabDataRateMultiplier
        // 8000 / 324000 / 2
        data_rate = 0.012346
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = xMeteor
            title = #KLEEC_XMETEOR_title
            desc = #KLEEC_XMETEOR_desc

            tech = advExploration
            mass = 2.5
            cost = 5000

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_xMeteor
            }
        }
    }
}