//==============================================================
// CALET
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_CALET
    title = #KLEEC_CALET_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 350
    scienceCap = 350

    // dataScale = size / value = 75000 / 350
    dataScale = 214.285714

    KERBALISM_EXPERIMENT
    {
        Situation = Space
        BodyAllowed = HomeBody
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        CALET
        {
            ECCost = 1.7
            size = 75000
            value = 350
            duration = 15729120
            SetupMass = 2.8
            SetupCost = 19500
            UnlockTech = electronics
            requirements = Module:TelescopeLabExperimentPackage
            CrewRequirement = Scientist:5
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_CALET

        ec_rate = 1.7
        crew_operate = Scientist:5
        requires = Module:TelescopeLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 75000 / 15729120 / 2
        data_rate = 0.002384
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = CALET
            title = #KLEEC_CALET_title
            desc = #KLEEC_CALET_desc

            tech = electronics
            mass = 2.8
            cost = 19500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_CALET
            }
        }
    }
}