//==============================================================
// BeaverCube
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_BeaverCube
    title = #KLEEC_BEAVERCUBE_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 10
    scienceCap = 10

    // dataScale = size / value = 2000 / 10
    dataScale = 200

    KERBALISM_EXPERIMENT
    {
        Situation = InSpaceLow@Biomes
        BodyAllowed = Oceanic
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        BeaverCube
        {
            ECCost = 1.00
            size = 2000
            value = 10
            duration = 64800
            SetupMass = 2.5
            SetupCost = 7000
            UnlockTech = advExploration
            requirements = Module:VisualLabExperimentPackage
            CrewRequirement = Scientist:3
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_BeaverCube

        ec_rate = 1.00
        crew_operate = Scientist:3
        requires = Module:VisualLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 2000 / 64800 / 2
        data_rate = 0.015432
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = BeaverCube
            title = #KLEEC_BEAVERCUBE_title
            desc = #KLEEC_BEAVERCUBE_desc

            tech = advExploration
            mass = 2.5
            cost = 7000

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_BeaverCube
            }
        }
    }
}