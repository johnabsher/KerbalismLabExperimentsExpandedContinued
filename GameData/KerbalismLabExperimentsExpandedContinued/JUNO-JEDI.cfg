//==============================================================
// JUNO-JEDI
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_JUNO-JEDI
    title = #KLEEC_JUNO_JEDI_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 40
    scienceCap = 40

    // dataScale = size / value = 14800 / 40
    dataScale = 370

    KERBALISM_EXPERIMENT
    {
        Situation = InSpaceLow
        BodyAllowed = Gaseous
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        JUNO-JEDI
        {
            ECCost = 1.7
            size = 14800
            value = 40
            duration = 1296000
            SetupMass = 2.1
            SetupCost = 7200
            UnlockTech = spaceExploration
            requirements = Module:RadioLabExperimentPackage
            CrewRequirement = Scientist:2
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_JUNO-JEDI

        ec_rate = 1.7
        crew_operate = Scientist:2
        requires = Module:RadioLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 14800 / 1296000 / 2
        data_rate = 0.005710
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = JUNO-JEDI
            title = #KLEEC_JUNO_JEDI_title
            desc = #KLEEC_JUNO_JEDI_desc

            tech = spaceExploration
            mass = 2.1
            cost = 7200

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_JUNO-JEDI
            }
        }
    }
}