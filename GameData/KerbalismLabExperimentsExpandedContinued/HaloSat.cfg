//==============================================================
// HaloSat
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_HaloSat
    title = #KLEEC_HALOSAT_title

    baseValue = 500
    scienceCap = 500
    dataScale = 150

    KERBALISM_EXPERIMENT
    {
        Situation = Space
        BodyAllowed = HomeBody
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        HaloSat
        {
            ECCost = 1.8
            size = 75000
            value = 500
            duration = 39322800
            SetupMass = 3.0
            SetupCost = 17500
            UnlockTech = scienceTech
            requirements = Module:TelescopeLabExperimentPackage
            CrewRequirement = Scientist:5
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_HaloSat

        ec_rate = 1.8
        crew_operate = Scientist:5
        requires = Module:TelescopeLabExperimentPackage
        data_rate = 0.001908
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = HaloSat
            title = #KLEEC_HALOSAT_title
            desc = #KLEEC_HALOSAT_desc

            tech = scienceTech
            mass = 3.0
            cost = 17500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_HaloSat
            }
        }
    }
}