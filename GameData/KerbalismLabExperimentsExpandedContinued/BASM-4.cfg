//==============================================================
// BASM-4
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_BASM-4
    title = #KLEEC_BASM_4_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 25
    scienceCap = 25

    // dataScale = size / value = 7400 / 25
    dataScale = 296

    KERBALISM_EXPERIMENT
    {
        Situation = SrfLanded
        BodyNotAllowed = HomeBody
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        BASM-4
        {
            ECCost = 1.1
            size = 7400
            value = 25
            duration = 1296000
            SetupMass = 1.4
            SetupCost = 5200
            UnlockTech = basicScience
            requirements = Module:MaterialsLabExperimentPackage
            CrewRequirement = Scientist:2
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_BASM-4

        ec_rate = 1.1
        crew_operate = Scientist:2
        requires = Module:MaterialsLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 7400 / 1296000 / 2
        data_rate = 0.002855
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = BASM-4
            title = #KLEEC_BASM_4_title
            desc = #KLEEC_BASM_4_desc

            tech = basicScience
            mass = 1.4
            cost = 5200

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_BASM-4
            }
        }
    }
}