//==============================================================
// JUNO-JIRAM
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_JUNO-JIRAM
    title = #KLEEC_JUNO_JIRAM_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 35
    scienceCap = 35

    // dataScale = size / value = 7000 / 35
    dataScale = 200

    KERBALISM_EXPERIMENT
    {
        Situation = InSpaceLow
        BodyAllowed = Gaseous
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        JUNO-JIRAM
        {
            ECCost = 0.5
            size = 7000
            value = 35
            duration = 1296000
            SetupMass = 2.0
            SetupCost = 4800
            UnlockTech = scienceTech
            requirements = Module:VisualLabExperimentPackage
            CrewRequirement = Scientist:2
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_JUNO-JIRAM

        ec_rate = 0.5
        crew_operate = Scientist:2
        requires = Module:VisualLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 7000 / 1296000 / 2
        data_rate = 0.002701
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = JUNO-JIRAM
            title = #KLEEC_JUNO_JIRAM_title
            desc = #KLEEC_JUNO_JIRAM_desc

            tech = scienceTech
            mass = 2.0
            cost = 4800

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_JUNO-JIRAM
            }
        }
    }
}