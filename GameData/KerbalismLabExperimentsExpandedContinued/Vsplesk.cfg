//==============================================================
// Vsplesk
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_Vsplesk
    title = #KLEEC_VSPLESK_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 35
    scienceCap = 35

    // dataScale = size / value = 3750 / 35
    dataScale = 107.142857

    KERBALISM_EXPERIMENT
    {
        Situation = InSpaceLow
        BodyNotAllowed = Gaseous
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        Vsplesk
        {
            ECCost = 1.1
            size = 3750
            value = 35
            duration = 3888000
            SetupMass = 2.0
            SetupCost = 7800
            UnlockTech = electrics
            requirements = Module:HighEnergyLabExperimentPackage
            CrewRequirement = Scientist:3
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_Vsplesk

        ec_rate = 1.1
        crew_operate = Scientist:3
        requires = Module:HighEnergyLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 3750 / 3888000 / 2
        data_rate = 0.000482
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = Vsplesk
            title = #KLEEC_VSPLESK_title
            desc = #KLEEC_VSPLESK_desc

            tech = electrics
            mass = 2.0
            cost = 7800

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_Vsplesk
            }
        }
    }
}