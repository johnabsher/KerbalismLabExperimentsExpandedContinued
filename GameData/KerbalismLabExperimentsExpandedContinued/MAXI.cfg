//==============================================================
// MAXI
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_MAXI
    title = #KLEEC_MAXI_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 50
    scienceCap = 50

    // dataScale = size / value = 5500 / 50
    dataScale = 110

    KERBALISM_EXPERIMENT
    {
        Situation = InSpaceHigh
        BodyAllowed = Planets
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        MAXI
        {
            ECCost = 0.8
            size = 5500
            value = 50
            duration = 9720000
            SetupMass = 1.4
            SetupCost = 4800
            UnlockTech = advConstruction
            requirements = Module:RadioLabExperimentPackage
            CrewRequirement = Scientist:3
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_MAXI

        ec_rate = 0.8
        crew_operate = Scientist:3
        requires = Module:RadioLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 5500 / 9720000 / 2
        data_rate = 0.000283
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = MAXI
            title = #KLEEC_MAXI_title
            desc = #KLEEC_MAXI_desc

            tech = advConstruction
            mass = 1.4
            cost = 4800

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_MAXI
            }
        }
    }
}