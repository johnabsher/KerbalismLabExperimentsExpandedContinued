//==============================================================
// GPAC-DFE
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_GPAC-DFE
    title = #KLEEC_GPAC_DFE_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 30
    scienceCap = 30

    // dataScale = size / value = 14800 / 30
    dataScale = 493.333333

    KERBALISM_EXPERIMENT
    {
        Situation = InSpaceLow
        BodyAllowed = Gaseous
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        GPAC-DFE
        {
            ECCost = 1.5
            size = 14800
            value = 30
            duration = 1296000
            SetupMass = 1.5
            SetupCost = 7900
            UnlockTech = scienceTech
            requirements = Module:MultispectralLabExperimentPackage
            CrewRequirement = Scientist:3
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_GPAC-DFE

        ec_rate = 1.5
        crew_operate = Scientist:3
        requires = Module:MultispectralLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 14800 / 1296000 / 2
        data_rate = 0.005710
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = GPAC-DFE
            title = #KLEEC_GPAC_DFE_title
            desc = #KLEEC_GPAC_DFE_desc

            tech = scienceTech
            mass = 1.5
            cost = 7900

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_GPAC-DFE
            }
        }
    }
}