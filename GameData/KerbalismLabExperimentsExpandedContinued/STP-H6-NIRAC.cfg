//==============================================================
// STP-H6-NIRAC
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_STP-H6-NIRAC
    title = #KLEEC_STP_H6_NIRAC_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 50
    scienceCap = 50

    // dataScale = size / value = 8500 / 50
    dataScale = 170

    KERBALISM_EXPERIMENT
    {
        Situation = InSpaceLow
        BodyAllowed = Atmospheric
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        STP-H6-NIRAC
        {
            ECCost = 1.2
            size = 8500
            value = 50
            duration = 648000
            SetupMass = 1.3
            SetupCost = 3500
            UnlockTech = scienceTech
            requirements = Module:MultispectralLabExperimentPackage,SunAngleMin:95
            CrewRequirement = Scientist:2
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_STP-H6-NIRAC

        ec_rate = 1.2
        crew_operate = Scientist:2
        requires = Module:MultispectralLabExperimentPackage,SunAngleMin:95

        // data_rate = size / duration / LabDataRateMultiplier
        // 8500 / 648000 / 2
        data_rate = 0.006559
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = STP-H6-NIRAC
            title = #KLEEC_STP_H6_NIRAC_title
            desc = #KLEEC_STP_H6_NIRAC_desc

            tech = scienceTech
            mass = 1.3
            cost = 3500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_STP-H6-NIRAC
            }
        }
    }
}