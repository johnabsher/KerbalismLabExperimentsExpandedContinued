//==============================================================
// JUNO-MAG
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_JUNO-MAG
    title = #KLEEC_JUNO_MAG_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 30
    scienceCap = 30

    // dataScale = size / value = 18400 / 30
    dataScale = 613.333333

    KERBALISM_EXPERIMENT
    {
        VirtualBiome = InnerBelt
        VirtualBiome = OuterBelt
        VirtualBiome = Magnetosphere
        VirtualBiome = Storm

        Situation = InSpaceLow@VirtualBiomes
        Situation = InSpaceHigh@VirtualBiomes

        BodyAllowed = Gaseous
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        JUNO-MAG
        {
            ECCost = 2.5
            size = 18400
            value = 30
            duration = 2592000
            SetupMass = 1.5
            SetupCost = 8500
            UnlockTech = generalConstruction
            requirements = Module:MagnetometerLabExperimentPackage
            CrewRequirement = Scientist:3
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_JUNO-MAG

        ec_rate = 2.5
        crew_operate = Scientist:3
        requires = Module:MagnetometerLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 18400 / 2592000 / 2
        data_rate = 0.003549
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = JUNO-MAG
            title = #KLEEC_JUNO_MAG_title
            desc = #KLEEC_JUNO_MAG_desc

            tech = generalConstruction
            mass = 1.5
            cost = 8500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_JUNO-MAG
            }
        }
    }
}