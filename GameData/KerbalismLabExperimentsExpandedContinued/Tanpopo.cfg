//==============================================================
// Tanpopo
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_Tanpopo
    title = #KLEEC_TANPOPO_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 25
    scienceCap = 25

    // dataScale = size / value = 1025 / 25
    dataScale = 41

    KERBALISM_EXPERIMENT
    {
        Situation = InSpaceLow
        Situation = InSpaceHigh
        SampleMass = 0.1
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        Tanpopo
        {
            ECCost = 0.1
            size = 1025
            value = 25
            duration = 3888000
            SetupMass = 1.2
            SetupCost = 7500
            UnlockTech = specializedScienceTech
            requirements = Module:BiologyLabExperimentPackage
            CrewRequirement = Scientist:3
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_Tanpopo

        ec_rate = 0.1
        crew_operate = Scientist:3
        requires = Module:BiologyLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 1025 / 3888000 / 2
        data_rate = 0.000132

        sample_collecting = True
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = Tanpopo
            title = #KLEEC_TANPOPO_title
            desc = #KLEEC_TANPOPO_desc

            tech = specializedScienceTech
            mass = 1.2
            cost = 7500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_Tanpopo
            }
        }
    }
}