//==============================================================
// MEGCO
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_MEGCO
    title = #KLEEC_MEGCO_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 20
    scienceCap = 20

    // dataScale = size / value = 12500 / 20
    dataScale = 625

    KERBALISM_EXPERIMENT
    {
        Situation = SrfSplashed@Biomes
        BodyAllowed = Oceanic
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        MEGCO
        {
            ECCost = 0.8
            size = 12500
            value = 20
            duration = 1944000
            SetupMass = 1.5
            SetupCost = 9500
            UnlockTech = survivability
            requirements = Module:FluidLabExperimentPackage
            CrewRequirement = Scientist:3
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_MEGCO

        ec_rate = 0.8
        crew_operate = Scientist:3
        requires = Module:FluidLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 12500 / 1944000 / 2
        data_rate = 0.003215
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = MEGCO
            title = #KLEEC_MEGCO_title
            desc = #KLEEC_MEGCO_desc

            tech = survivability
            mass = 1.5
            cost = 9500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_MEGCO
            }
        }
    }
}