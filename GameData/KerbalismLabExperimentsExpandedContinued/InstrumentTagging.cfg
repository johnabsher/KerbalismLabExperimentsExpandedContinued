//==============================================================
// Custom KLEEC parts
//==============================================================

+PART[RelayAntenna100]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @name = AntennaRadioLab
    @title = #KLEEC_PART_ANTENNARADIOLAB_title
    @description = #KLEEC_PART_ANTENNARADIOLAB_desc
    @category = Science

    !MODULE[PlannerController] {}
    !MODULE[ModuleDataTransmitter] {}
    !MODULE[ModuleAntennaFeed] {}
    !MODULE[ModuleDataTransmitterFeedeable] {}
    !MODULE[ModuleRelayAntenna] {}
    !MODULE[Reliability] {}

    MODULE
    {
        name = RadioLabExperimentPackage
    }
}

+PART[ScienceBox]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @name = ScienceBox-HighEnergy
    @title = #KLEEC_PART_SCIENCEBOXHIGHENERGY_title
    @description = #KLEEC_PART_SCIENCEBOXHIGHENERGY_desc
    @category = Science

    !MODULE[HardDrive] {}

    MODULE
    {
        name = HighEnergyLabExperimentPackage
    }
}

