//==============================================================
// MastCam-1
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_MastCam-1
    title = #KLEEC_MASTCAM_1_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 10
    scienceCap = 10

    // dataScale = size / value = 12000 / 10
    dataScale = 1200

    KERBALISM_EXPERIMENT
    {
        Situation = SrfLanded@Biomes
        BodyNotAllowed = HomeBody
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        MastCam-1
        {
            ECCost = 1.2
            size = 12000
            value = 10
            duration = 648000
            SetupMass = 1.2
            SetupCost = 5500
            UnlockTech = advExploration
            requirements = Module:VisualLabExperimentPackage,Sunlight
            CrewRequirement = Scientist:2
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_MastCam-1

        ec_rate = 1.2
        crew_operate = Scientist:2
        requires = Module:VisualLabExperimentPackage,Sunlight

        // data_rate = size / duration / LabDataRateMultiplier
        // 12000 / 648000 / 2
        data_rate = 0.009259
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = MastCam-1
            title = #KLEEC_MASTCAM_1_title
            desc = #KLEEC_MASTCAM_1_desc

            tech = advExploration
            mass = 1.2
            cost = 5500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_MastCam-1
            }
        }
    }
}