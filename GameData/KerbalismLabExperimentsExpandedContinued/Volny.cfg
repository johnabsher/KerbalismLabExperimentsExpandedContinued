//==============================================================
// Volny
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_Volny
    title = #KLEEC_VOLNY_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 30
    scienceCap = 30

    // dataScale = size / value = 7500 / 30
    dataScale = 250

    KERBALISM_EXPERIMENT
    {
        Situation = InSpaceLow
        BodyAllowed = Atmospheric
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        Volny
        {
            ECCost = 1.3
            size = 7500
            value = 30
            duration = 2376000
            SetupMass = 1.8
            SetupCost = 9500
            UnlockTech = advUnmanned
            requirements = Module:RadarLabExperimentPackage
            CrewRequirement = Scientist:3
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_Volny

        ec_rate = 1.3
        crew_operate = Scientist:3
        requires = Module:RadarLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 7500 / 2376000 / 2
        data_rate = 0.001578
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = Volny
            title = #KLEEC_VOLNY_title
            desc = #KLEEC_VOLNY_desc

            tech = advUnmanned
            mass = 1.8
            cost = 9500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_Volny
            }
        }
    }
}