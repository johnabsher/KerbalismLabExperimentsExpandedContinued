//==============================================================
// GEDI
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_GEDI
    title = #KLEEC_GEDI_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 10
    scienceCap = 10

    // dataScale = size / value = 500 / 10
    dataScale = 50

    KERBALISM_EXPERIMENT
    {
        Situation = InSpaceLow@Biomes
        BodyAllowed = HomeBody
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        GEDI
        {
            ECCost = 0.5
            size = 500
            value = 10
            duration = 21600
            SetupMass = 0.5
            SetupCost = 2500
            UnlockTech = advExploration
            requirements = Module:MultispectralLabExperimentPackage,SunAngleMax:80
            CrewRequirement = Scientist:1
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_GEDI

        ec_rate = 0.5
        crew_operate = Scientist:1
        requires = Module:MultispectralLabExperimentPackage,SunAngleMax:80

        // data_rate = size / duration / LabDataRateMultiplier
        // 500 / 21600 / 2
        data_rate = 0.011574
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = GEDI
            title = #KLEEC_GEDI_title
            desc = #KLEEC_GEDI_desc

            tech = advExploration
            mass = 0.5
            cost = 2500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_GEDI
            }
        }
    }
}