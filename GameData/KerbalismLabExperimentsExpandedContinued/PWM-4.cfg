//==============================================================
// PWM-4
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_PWM-4
    title = #KLEEC_PWM_4_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 75
    scienceCap = 75

    // dataScale = size / value = 15000 / 75
    dataScale = 200

    KERBALISM_EXPERIMENT
    {
        Situation = Space
        BodyAllowed = HomeBody
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        PWM-4
        {
            ECCost = 1.5
            size = 15000
            value = 75
            duration = 8640000
            SetupMass = 1.5
            SetupCost = 2500
            UnlockTech = hydroponics
            requirements = Greenhouse
            CrewRequirement = Scientist:1
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_PWM-4

        ec_rate = 1.5
        crew_operate = Scientist:1
        requires = Greenhouse

        // data_rate = size / duration / LabDataRateMultiplier
        // 15000 / 8640000 / 2
        data_rate = 0.000868
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = PWM-4
            title = #KLEEC_PWM_4_title
            desc = #KLEEC_PWM_4_desc

            tech = hydroponics
            mass = 1.5
            cost = 2500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_PWM-4
            }
        }
    }
}