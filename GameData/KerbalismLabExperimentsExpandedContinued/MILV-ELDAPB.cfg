//==============================================================
// MILV-ELDAPB
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_MILV-ELDAPB
    title = #KLEEC_MILV_ELDAPB_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 40
    scienceCap = 40

    // dataScale = size / value = 22500 / 40
    dataScale = 562.5

    KERBALISM_EXPERIMENT
    {
        Situation = SrfLanded
        BodyNotAllowed = Atmospheric
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        MILV-ELDAPB
        {
            ECCost = 1.7
            size = 22500
            value = 40
            duration = 7776000
            SetupMass = 2.1
            SetupCost = 10500
            UnlockTech = spaceExploration
            requirements = Module:SurfaceLabExperimentPackage
            CrewRequirement = Scientist:4
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_MILV-ELDAPB

        ec_rate = 1.7
        crew_operate = Scientist:4
        requires = Module:SurfaceLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 22500 / 7776000 / 2
        data_rate = 0.001447
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = MILV-ELDAPB
            title = #KLEEC_MILV_ELDAPB_title
            desc = #KLEEC_MILV_ELDAPB_desc

            tech = spaceExploration
            mass = 2.1
            cost = 10500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_MILV-ELDAPB
            }
        }
    }
}