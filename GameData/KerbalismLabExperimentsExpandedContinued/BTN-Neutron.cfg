//==============================================================
// BTN-Neutron
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_BTN-Neutron
    title = #KLEEC_BTN_NEUTRON_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 20
    scienceCap = 20

    // dataScale = size / value = 7500 / 20
    dataScale = 375

    KERBALISM_EXPERIMENT
    {
        VirtualBiome = InnerBelt
        VirtualBiome = OuterBelt
        VirtualBiome = Magnetosphere
        VirtualBiome = Storm

        Situation = InSpaceLow@VirtualBiomes
        Situation = InSpaceHigh@VirtualBiomes
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        BTN-Neutron
        {
            ECCost = 2.00
            size = 7500
            value = 20
            duration = 216000
            SetupMass = 1.00
            SetupCost = 5000
            UnlockTech = engineering101
            requirements = Module:HighEnergyLabExperimentPackage
            CrewRequirement = Scientist:2
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_BTN-Neutron

        ec_rate = 2.00
        crew_operate = Scientist:2
        requires = Module:HighEnergyLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 7500 / 216000 / 2
        data_rate = 0.017361
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = BTN-Neutron
            title = #KLEEC_BTN_NEUTRON_title
            desc = #KLEEC_BTN_NEUTRON_desc

            tech = engineering101
            mass = 1.00
            cost = 5000

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_BTN-Neutron
            }
        }
    }
}