//==============================================================
// IBATE-IWC
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_IBATE-IWC
    title = #KLEEC_IBATE_IWC_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 10
    scienceCap = 10

    // dataScale = size / value = 7500 / 10
    dataScale = 750

    KERBALISM_EXPERIMENT
    {
        Situation = SrfLanded@Biomes
        BodyNotAllowed = HomeBody
        BodyAllowed = Atmospheric
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        IBATE-IWC
        {
            ECCost = 0.5
            size = 7500
            value = 10
            duration = 648000
            SetupMass = 1.5
            SetupCost = 7800
            UnlockTech = advExploration
            requirements = Module:SurfaceLabExperimentPackage,Sunlight
            CrewRequirement = Scientist:1
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_IBATE-IWC

        ec_rate = 0.5
        crew_operate = Scientist:1
        requires = Module:SurfaceLabExperimentPackage,Sunlight

        // data_rate = size / duration / LabDataRateMultiplier
        // 7500 / 648000 / 2
        data_rate = 0.005787
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = IBATE-IWC
            title = #KLEEC_IBATE_IWC_title
            desc = #KLEEC_IBATE_IWC_desc

            tech = advExploration
            mass = 1.5
            cost = 7800

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_IBATE-IWC
            }
        }
    }
}