//==============================================================
// TPSMMO
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_TPSMMO
    title = #KLEEC_TPSMMO_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 30
    scienceCap = 30

    // dataScale = size / value = 11000 / 30
    dataScale = 366.666667

    KERBALISM_EXPERIMENT
    {
        Situation = SrfLanded
        BodyNotAllowed = HomeBody
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        TPSMMO
        {
            ECCost = 3
            size = 11000
            value = 30
            duration = 1944000
            SetupMass = 2.5
            SetupCost = 15000
            UnlockTech = miniaturization
            requirements = Module:MaterialsLabExperimentPackage
            CrewRequirement = Scientist:3
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_TPSMMO

        ec_rate = 3
        crew_operate = Scientist:3
        requires = Module:MaterialsLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 11000 / 1944000 / 2
        data_rate = 0.002829
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = TPSMMO
            title = #KLEEC_TPSMMO_title
            desc = #KLEEC_TPSMMO_desc

            tech = miniaturization
            mass = 2.5
            cost = 15000

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_TPSMMO
            }
        }
    }
}