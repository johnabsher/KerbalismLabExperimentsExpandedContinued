//==============================================================
// JUNO-GSE
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_JUNO-GSE
    title = #KLEEC_JUNO_GSE_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 40
    scienceCap = 40

    // dataScale = size / value = 18000 / 40
    dataScale = 450

    KERBALISM_EXPERIMENT
    {
        Situation = InSpaceHigh
        BodyAllowed = Gaseous
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        JUNO-GSE
        {
            ECCost = 2.2
            size = 18000
            value = 40
            duration = 3888000
            SetupMass = 2.5
            SetupCost = 10500
            UnlockTech = electronics
            requirements = Module:GravityLabExperimentPackage,OrbitMinInclination:85,OrbitMaxInclination:95
            CrewRequirement = Scientist:4
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_JUNO-GSE

        ec_rate = 2.2
        crew_operate = Scientist:4
        requires = Module:GravityLabExperimentPackage,OrbitMinInclination:85,OrbitMaxInclination:95

        // data_rate = size / duration / LabDataRateMultiplier
        // 18000 / 3888000 / 2
        data_rate = 0.002315
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = JUNO-GSE
            title = #KLEEC_JUNO_GSE_title
            desc = #KLEEC_JUNO_GSE_desc

            tech = electronics
            mass = 2.5
            cost = 10500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_JUNO-GSE
            }
        }
    }
}