//==============================================================
// ChemCam-2
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_ChemCam-2
    title = #KLEEC_CHEMCAM_2_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 12
    scienceCap = 12

    // dataScale = size / value = 5000 / 12
    dataScale = 416.666667

    KERBALISM_EXPERIMENT
    {
        Situation = SrfLanded@Biomes
        BodyNotAllowed = HomeBody
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        ChemCam-2
        {
            ECCost = 0.5
            size = 5000
            value = 12
            duration = 216000
            SetupMass = 0.5
            SetupCost = 4500
            UnlockTech = spaceExploration

            // was Module:ModuleRobotArmScanner,
            // but Module:ModuleRobotArmScanner doesn't exist in InstrumentTagging.cfg.
            // from the excel table - sensor tag = surface.
            requirements = Module:SurfaceLabExperimentPackage

            CrewRequirement = Scientist:1
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_ChemCam-2

        ec_rate = 0.5
        crew_operate = Scientist:1
        requires = Module:SurfaceLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 5000 / 216000 / 2
        data_rate = 0.011574
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = ChemCam-2
            title = #KLEEC_CHEMCAM_2_title
            desc = #KLEEC_CHEMCAM_2_desc

            tech = spaceExploration
            mass = 0.5
            cost = 4500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_ChemCam-2
            }
        }
    }
}