//==============================================================
// TAPAR-1
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_TAPAR-1
    title = #KLEEC_TAPAR_1_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 15
    scienceCap = 15

    // dataScale = size / value = 2000 / 15
    dataScale = 133.333333

    KERBALISM_EXPERIMENT
    {
        Situation = InSpaceLow@Biomes
        BodyNotAllowed = Atmospheric
        BodyNotAllowed = Gaseous
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        TAPAR-1
        {
            ECCost = 1.3
            size = 2000
            value = 15
            duration = 43200
            SetupMass = 2.3
            SetupCost = 8427
            UnlockTech = experimentalScience
            requirements = Module:SpectrometerLabExperimentPackage,SunAngleMax:80
            CrewRequirement = Scientist:3
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_TAPAR-1

        ec_rate = 1.3
        crew_operate = Scientist:3
        requires = Module:SpectrometerLabExperimentPackage,SunAngleMax:80

        // data_rate = size / duration / LabDataRateMultiplier
        // 2000 / 43200 / 2
        data_rate = 0.023148
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = TAPAR-1
            title = #KLEEC_TAPAR_1_title
            desc = #KLEEC_TAPAR_1_desc

            tech = experimentalScience
            mass = 2.3
            cost = 8427

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_TAPAR-1
            }
        }
    }
}