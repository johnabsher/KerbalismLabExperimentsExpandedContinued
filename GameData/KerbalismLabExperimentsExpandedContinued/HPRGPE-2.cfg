//==============================================================
// HPRGPE-2
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_HPRGPE-2
    title = #KLEEC_HPRGPE_2_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 25
    scienceCap = 25

    // dataScale = size / value = 8500 / 25
    dataScale = 340

    KERBALISM_EXPERIMENT
    {
        Situation = InSpaceLow
        BodyNotAllowed = HomeBody
        BodyAllowed = Gaseous
        BodyAllowed = Atmospheric
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        HPRGPE-2
        {
            ECCost = 0.8
            size = 8500
            value = 25
            duration = 972000
            SetupMass = 1.5
            SetupCost = 5500
            UnlockTech = scienceTech
            requirements = Module:SpectrometerLabExperimentPackage,SunAngleMax:80
            CrewRequirement = Scientist:2
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_HPRGPE-2

        ec_rate = 0.8
        crew_operate = Scientist:2
        requires = Module:SpectrometerLabExperimentPackage,SunAngleMax:80

        // data_rate = size / duration / LabDataRateMultiplier
        // 8500 / 972000 / 2
        data_rate = 0.004372
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = HPRGPE-2
            title = #KLEEC_HPRGPE_2_title
            desc = #KLEEC_HPRGPE_2_desc

            tech = scienceTech
            mass = 1.5
            cost = 5500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_HPRGPE-2
            }
        }
    }
}