//==============================================================
// PPSE-1
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_PPSE-1
    title = #KLEEC_PPSE_1_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 10
    scienceCap = 10

    // dataScale = size / value = 1500 / 10
    dataScale = 150

    KERBALISM_EXPERIMENT
    {
        Situation = SrfLanded@Biomes
        BodyNotAllowed = HomeBody
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        PPSE-1
        {
            ECCost = 1.2
            size = 1500
            value = 10
            duration = 216000
            SetupMass = 0.5
            SetupCost = 2500
            UnlockTech = spaceExploration
            requirements = Module:DrillLabExperimentPackage
            CrewRequirement = Scientist:1
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_PPSE-1

        ec_rate = 1.2
        crew_operate = Scientist:1
        requires = Module:DrillLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 1500 / 216000 / 2
        data_rate = 0.003472
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = PPSE-1
            title = #KLEEC_PPSE_1_title
            desc = #KLEEC_PPSE_1_desc

            tech = spaceExploration
            mass = 0.5
            cost = 2500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_PPSE-1
            }
        }
    }
}