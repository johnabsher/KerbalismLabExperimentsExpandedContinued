//==============================================================
// ORZS-3
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_ORZS-3
    title = #KLEEC_ORZS_3_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 35
    scienceCap = 35

    // dataScale = size / value = 15000 / 35
    dataScale = 428.571429

    KERBALISM_EXPERIMENT
    {
        Situation = SrfLanded
        BodyNotAllowed = HomeBody
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        ORZS-3
        {
            ECCost = 1.5
            size = 15000
            value = 35
            duration = 8640000
            SetupMass = 2.5
            SetupCost = 12000
            UnlockTech = hydroponics
            requirements = Greenhouse
            CrewRequirement = Scientist:2
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_ORZS-3

        ec_rate = 1.5
        crew_operate = Scientist:2
        requires = Greenhouse

        // data_rate = size / duration / LabDataRateMultiplier
        // 15000 / 8640000 / 2
        data_rate = 0.000868
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = ORZS-3
            title = #KLEEC_ORZS_3_title
            desc = #KLEEC_ORZS_3_desc

            tech = hydroponics
            mass = 2.5
            cost = 12000

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_ORZS-3
            }
        }
    }
}