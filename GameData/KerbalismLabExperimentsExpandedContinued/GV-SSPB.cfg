//==============================================================
// GV-SSPB
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_GV-SSPB
    title = #KLEEC_GV_SSPB_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 12
    scienceCap = 12

    // dataScale = size / value = 14500 / 12
    dataScale = 1208.333333

    KERBALISM_EXPERIMENT
    {
        Situation = SrfLanded@Biomes
        BodyNotAllowed = HomeBody
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        GV-SSPB
        {
            ECCost = 2
            size = 14500
            value = 12
            duration = 4320000
            SetupMass = 1.2
            SetupCost = 5300
            UnlockTech = advExploration
            requirements = Module:GravityLabExperimentPackage
            CrewRequirement = Scientist:2
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_GV-SSPB

        ec_rate = 2
        crew_operate = Scientist:2
        requires = Module:GravityLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 14500 / 4320000 / 2
        data_rate = 0.001678
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = GV-SSPB
            title = #KLEEC_GV_SSPB_title
            desc = #KLEEC_GV_SSPB_desc

            tech = advExploration
            mass = 1.2
            cost = 5300

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_GV-SSPB
            }
        }
    }
}