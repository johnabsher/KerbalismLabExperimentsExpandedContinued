//==============================================================
// SOCP-7
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_SOCP-7
    title = #KLEEC_SOCP_7_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 10
    scienceCap = 10

    // dataScale = size / value = 750 / 10
    dataScale = 75

    KERBALISM_EXPERIMENT
    {
        Situation = InSpaceLow@Biomes
        BodyAllowed = Moons
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        SOCP-7
        {
            ECCost = 1.5
            size = 750
            value = 10
            duration = 86400
            SetupMass = 1.8
            SetupCost = 7500
            UnlockTech = advExploration
            requirements = Module:RadarLabExperimentPackage,SunAngleMax:80
            CrewRequirement = Scientist:2
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_SOCP-7

        ec_rate = 1.5
        crew_operate = Scientist:2
        requires = Module:RadarLabExperimentPackage,SunAngleMax:80

        // data_rate = size / duration / LabDataRateMultiplier
        // 750 / 86400 / 2
        data_rate = 0.004340
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = SOCP-7
            title = #KLEEC_SOCP_7_title
            desc = #KLEEC_SOCP_7_desc

            tech = advExploration
            mass = 1.8
            cost = 7500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_SOCP-7
            }
        }
    }
}