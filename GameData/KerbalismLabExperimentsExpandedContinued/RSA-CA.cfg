//==============================================================
// RSA-CA
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_RSA-CA
    title = #KLEEC_RSA_CA_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 12
    scienceCap = 12

    // dataScale = size / value = 11000 / 12
    dataScale = 916.666667

    KERBALISM_EXPERIMENT
    {
        Situation = SrfLanded@Biomes
        BodyNotAllowed = HomeBody
        BodyAllowed = Atmospheric
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        RSA-CA
        {
            ECCost = 1.2
            size = 11000
            value = 12
            duration = 3888000
            SetupMass = 1.8
            SetupCost = 7500
            UnlockTech = aerodynamicSystems
            requirements = Module:AtmosphereLabExperimentPackage
            CrewRequirement = Scientist:3
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_RSA-CA

        ec_rate = 1.2
        crew_operate = Scientist:3
        requires = Module:AtmosphereLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 11000 / 3888000 / 2
        data_rate = 0.001415
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = RSA-CA
            title = #KLEEC_RSA_CA_title
            desc = #KLEEC_RSA_CA_desc

            tech = aerodynamicSystems
            mass = 1.8
            cost = 7500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_RSA-CA
            }
        }
    }
}