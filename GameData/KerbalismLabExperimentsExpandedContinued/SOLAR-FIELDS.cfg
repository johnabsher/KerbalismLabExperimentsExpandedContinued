//==============================================================
// SOLAR-FIELDS
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_SOLAR-FIELDS
    title = #KLEEC_SOLAR_FIELDS_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 45
    scienceCap = 45

    // dataScale = size / value = 17000 / 45
    dataScale = 377.777778

    KERBALISM_EXPERIMENT
    {
        Situation = Space
        BodyAllowed = Suns
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        SOLAR-FIELDS
        {
            ECCost = 1.8
            size = 17000
            value = 45
            duration = 7776000
            SetupMass = 2.5
            SetupCost = 11000
            UnlockTech = spaceExploration
            requirements = Module:PlasmaLabExperimentPackage
            CrewRequirement = Scientist:3
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_SOLAR-FIELDS

        ec_rate = 1.8
        crew_operate = Scientist:3
        requires = Module:PlasmaLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 17000 / 7776000 / 2
        data_rate = 0.001093
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = SOLAR-FIELDS
            title = #KLEEC_SOLAR_FIELDS_title
            desc = #KLEEC_SOLAR_FIELDS_desc

            tech = spaceExploration
            mass = 2.5
            cost = 11000

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_SOLAR-FIELDS
            }
        }
    }
}