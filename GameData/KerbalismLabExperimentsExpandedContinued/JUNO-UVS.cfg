//==============================================================
// JUNO-UVS
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_JUNO-UVS
    title = #KLEEC_JUNO_UVS_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 45
    scienceCap = 45

    // dataScale = size / value = 11400 / 45
    dataScale = 253.333333

    KERBALISM_EXPERIMENT
    {
        Situation = InSpaceLow
        BodyAllowed = Gaseous
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        JUNO-UVS
        {
            ECCost = 1.3
            size = 11400
            value = 45
            duration = 3888000
            SetupMass = 1.1
            SetupCost = 5500
            UnlockTech = scienceTech
            requirements = Module:SpectrometerLabExperimentPackage
            CrewRequirement = Scientist:3
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_JUNO-UVS

        ec_rate = 1.3
        crew_operate = Scientist:3
        requires = Module:SpectrometerLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 11400 / 3888000 / 2
        data_rate = 0.001466
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = JUNO-UVS
            title = #KLEEC_JUNO_UVS_title
            desc = #KLEEC_JUNO_UVS_desc

            tech = scienceTech
            mass = 1.1
            cost = 5500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_JUNO-UVS
            }
        }
    }
}