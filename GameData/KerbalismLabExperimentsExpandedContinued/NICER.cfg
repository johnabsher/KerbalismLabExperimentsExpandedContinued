//==============================================================
// NICER
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_NICER
    title = #KLEEC_NICER_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 300
    scienceCap = 300

    // dataScale = size / value = 18500 / 300
    dataScale = 61.666667

    KERBALISM_EXPERIMENT
    {
        Situation = Space
        BodyAllowed = HomeBody
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        NICER
        {
            ECCost = 2.00
            size = 18500
            value = 300
            duration = 31458240
            SetupMass = 3.2
            SetupCost = 15000
            UnlockTech = scienceTech
            requirements = Module:TelescopeLabExperimentPackage
            CrewRequirement = Scientist:4
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_NICER

        ec_rate = 2.00
        crew_operate = Scientist:4
        requires = Module:TelescopeLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 18500 / 31458240 / 2
        data_rate = 0.000294
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = NICER
            title = #KLEEC_NICER_title
            desc = #KLEEC_NICER_desc

            tech = scienceTech
            mass = 3.2
            cost = 15000

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_NICER
            }
        }
    }
}