//==============================================================
// Strata-1
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_Strata-1
    title = #KLEEC_STRATA_1_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 10
    scienceCap = 10

    // dataScale = size / value = 2750 / 10
    dataScale = 275

    KERBALISM_EXPERIMENT
    {
        Situation = SrfLanded@Biomes
        BodyNotAllowed = Atmospheric
        BodyNotAllowed = HomeBody
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        Strata-1
        {
            ECCost = 2.5
            size = 2750
            value = 10
            duration = 216000
            SetupMass = 3
            SetupCost = 3500
            UnlockTech = scienceTech
            CrewRequirement = Scientist:1
            ResourceRates = Ore@0.001
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_Strata-1

        ec_rate = 2.5
        crew_operate = Scientist:1

        // data_rate = size / duration / LabDataRateMultiplier
        // 2750 / 216000 / 2
        data_rate = 0.006366

        resources = Ore@0.001
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = Strata-1
            title = #KLEEC_STRATA_1_title
            desc = #KLEEC_STRATA_1_desc

            tech = scienceTech
            mass = 3
            cost = 3500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_Strata-1
            }
        }
    }
}