//==============================================================
// CATS
//==============================================================

EXPERIMENT_DEFINITION:NEEDS[FeatureScience]
{
    id = kerbalism_CATS
    title = #KLEEC_CATS_title

    // effective baseValue from LAB_EXPERIMENTS value
    baseValue = 10
    scienceCap = 10

    // dataScale = size / value = 450 / 10
    dataScale = 45

    KERBALISM_EXPERIMENT
    {
        Situation = InSpaceLow@Biomes
        BodyAllowed = HomeBody
    }
}

@KERBALISM_GROUP_SETTINGS:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    @LAB_EXPERIMENTS
    {
        CATS
        {
            ECCost = 0.5
            size = 450
            value = 10
            duration = 21600
            SetupMass = 0.5
            SetupCost = 2500
            UnlockTech = electrics
            requirements = Sunlight,Module:MultispectralLabExperimentPackage
            CrewRequirement = Scientist:1
        }
    }
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]]:NEEDS[FeatureScience]:AFTER[Kerbalism]
{
    MODULE
    {
        name = Experiment
        experiment_id = kerbalism_CATS

        ec_rate = 0.5
        crew_operate = Scientist:1
        requires = Sunlight,Module:MultispectralLabExperimentPackage

        // data_rate = size / duration / LabDataRateMultiplier
        // 450 / 21600 / 2
        data_rate = 0.010417
    }

    @MODULE[Configure]:HAS[#configureId[LaboratoryExperiments]]
    {
        SETUP
        {
            name = CATS
            title = #KLEEC_CATS_title
            desc = #KLEEC_CATS_desc

            tech = electrics
            mass = 0.5
            cost = 2500

            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = kerbalism_CATS
            }
        }
    }
}